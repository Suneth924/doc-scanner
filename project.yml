name: DocScanner
options:
  bundleIdPrefix: com.suneth
  deploymentTarget:
    iOS: "17.0"
targets:
  DocScanner:
    type: application
    platform: iOS
    sources:
      - path: DocScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suneth.docscanner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DocScanner
        INFOPLIST_KEY_NSCameraUsageDescription: "DocScanner uses the camera to scan documents."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "DocScanner shares your scans with computers on your network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
